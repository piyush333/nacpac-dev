version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: personal-ai-os-db
    environment:
      POSTGRES_USER: ${DB_USER:-aiuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aigenious}
      POSTGRES_DB: ${DB_NAME:-personal_ai_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
