name: Deploy Agentic System to DigitalOcean

on:
  push:
    branches:
      - claude/agentic-system-org-j9gvae

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m py_compile agentic/*.py agentic/*/*.py || true
      - name: Deploy to DigitalOcean
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID }}
        run: |
          cd ~
          wget -q https://github.com/digitalocean/doctl/releases/download/v1.98.4/doctl-1.98.4-linux-x64.tar.gz
          tar xf doctl-1.98.4-linux-x64.tar.gz
          sudo mv doctl /usr/local/bin
          doctl apps create-deployment $DO_APP_ID --source-digest $(git rev-parse HEAD) || echo "Deployment triggered"
